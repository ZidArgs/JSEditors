<div class="header">
    <emc-input-search id="search"></emc-input-search>
</div>
<emc-grid-datagrid id="grid" nohead stretched="value">
    <emc-grid-column name="name" caption="Key" type="string" width="200"></emc-grid-column>
    <emc-grid-column name="value" caption="Translation" type="text" width="300" editable action="value"></emc-grid-column>
    <emc-grid-column name="delete" caption="" type="button" width="100" text="Delete" action="delete"></emc-grid-column>
</emc-grid-datagrid>
<emc-form-row class="footer" align="end">
    <emc-button id="jump-unset" text="jump to next untranslated, 0 remaining" icon="⚠" style="align-self: start;"></emc-button>
    <emc-button id="import" text="Import" icon="➲"></emc-button>
    <emc-button id="add" text="Add entry" icon="+"></emc-button>
</emc-form-row>
