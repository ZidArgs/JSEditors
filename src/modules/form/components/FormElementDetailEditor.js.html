<emc-form-container id="form-container" hasheader hasfooter>
    <form id="header-form">
        <h1>Element Config</h1>
        <emc-field-select-search label="Type" name="type" id="type-select"></emc-field-select-search>
        <emc-form-field>
            <emc-input-string label="ID" name="id"></emc-input-string>
        </emc-form-field>
    </form>
    <form id="detail-form"></form>
    <form id="footer-form">
        <emc-form-row align="end">
            <emc-button-reset></emc-button-reset>
            <emc-button-submit></emc-button-submit>
        </emc-form-row>
    </form>
</emc-form-container>
