<emc-form-container id="form-container">
    <form id="header-form" slot="header">
        <h1>Element Config</h1>
        <emc-select-search label="Type" name="type" id="type-select"></emc-select-search>
        <emc-field-input-string label="ID" name="id"></emc-field-input-string>
    </form>
    <form id="detail-form"></form>
    <form id="footer-form" slot="header">
        <emc-form-row align="end">
            <emc-button-reset></emc-button-reset>
            <emc-button-submit></emc-button-submit>
        </emc-form-row>
    </form>
</emc-form-container>
